# See docs at: https://mystmd.org/guide/frontmatter
version: 1
project:
  id: c76d1b0d-663b-4106-8bc4-c7926e2040b4
  title: Matemáticas Aplicadas IV
  description: "Material interactivo y reproducible para el curso Matemáticas Aplicadas IV de la Universidad Icesi."
  keywords:
    - matematicas
    - aplicadas
    - jupyter-book
    - modelacion
    - python
    - docencia
  authors:
    - name: "Editores: Angela Villota y Aníbal Sosa"
  settings:
    output_matplotlib_strings: remove
  # Template repository. When creating a course from this template,
  # change this URL to the new course repository.
  github: https://github.com/Icesi-MA/Matematicas-Aplicadas-IV
  jupyter:
    binder:
      # Template Binder repository. When creating a course from this template,
      # change this value to "owner/repository" for the new course.
      repo: Icesi-MA/Matematicas-Aplicadas-IV
      ref: main

  toc:
    - file: README.md
    - title: "Unidad 1: Sistemas de ecuaciones diferenciales ordinarias (EDO) de primer orden"
      children:
        - file: Notebooks/Cuaderno1.ipynb
        - file: Entregas/Entrega1.ipynb
        - file: Notebooks/Cuaderno2.ipynb
        - file: Entregas/Entrega2.ipynb
        - file: Notebooks/Cuaderno3.ipynb
        - file: Entregas/Entrega3.ipynb
        - file: Notebooks/Cuaderno4.ipynb
        - file: Entregas/Entrega4.ipynb
        - file: Notebooks/Cuaderno5.ipynb
        - file: Jornadas/JRP1PColab.ipynb
    - title: "Unidad 2: Sistemas lineales de ecuaciones diferenciales ordinarias"
      children:
        - file: Notebooks/Cuaderno6.ipynb
        - file: Entregas/Entrega6.ipynb
        - file: Notebooks/Cuaderno7.ipynb
        - file: Entregas/Entrega7.ipynb
        - file: Notebooks/Cuaderno8.ipynb
        - file: Entregas/MA_IV-Entrega8.ipynb
        - file: Notebooks/Cuaderno9.ipynb
        - file: Notebooks/Cuaderno10.ipynb
        - file: Jornadas/JRP2PColab.ipynb

    - title: "Unidad 3: Sistemas no lineales de ecuaciones diferenciales ordinarias"
      children:
        - file: Notebooks/Cuaderno11.ipynb
        - file: Entregas/MA_IV-Entrega9.ipynb
        - file: Notebooks/Cuaderno12.ipynb
        - file: Entregas/MA_IV-Entrega10.ipynb
        - file: Notebooks/Cuaderno13.ipynb
        - file: Jornadas/JRP3PColab.ipynb
    - title: "Proyecto final"
      children:
        - file: Proyecto/ProyectoMatematicasAplicadas4.ipynb
site:
  template: book-theme
  options:
    logo: _static/icesi-logo.svg
    logo_dark: _static/icesi-logo-dark.svg
    logo_text: Matemáticas Aplicadas IV
    logo_url: https://www.icesi.edu.co/
    logo_alt: Universidad Icesi
    style: _static/icesi.css
    folders: true
